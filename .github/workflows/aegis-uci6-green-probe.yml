name: AEGIS UCI-6 GREEN Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'AEGIS_UCI6_GREEN.md'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: Aegis-Omega/AEGIS-OMEGA
      CANDIDATE_SHA: 8a2d2d6859619e5dd69b2c12bb6627c0cfc7760c
      EXPECTED_PARENT_SHA: c47e99b8139a280c39ceacc46db738b2617866d5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5 jsonschema==4.23.0
      - name: Verify exact stacked lineage
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          echo "UCI6_INTERNAL_BASE_GREEN_EXACT_LINEAGE=PASS"
      - name: Run complete focused UCI-6 suite
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            sovereign-omega-v2/python/tests/test_uci6_collective_memory.py \
            sovereign-omega-v2/python/tests/test_uci6_memory_prestate.py \
            sovereign-omega-v2/python/tests/test_uci6_memory_schemas.py \
            sovereign-omega-v2/python/tests/test_uci6_internal_base_guard.py \
            -q | tee "$RUNNER_TEMP/uci6-focused.log"
          grep -Eq '26 passed' "$RUNNER_TEMP/uci6-focused.log"
          echo "UCI6_INTERNAL_BASE_GREEN_26=PASS"
