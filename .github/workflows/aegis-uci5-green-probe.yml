name: AEGIS UCI-5 CI Contract RED Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'AEGIS_UCI5_CI_CONTRACT.md'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: Aegis-Omega/AEGIS-OMEGA
      CANDIDATE_SHA: 418a8464e1aa4ccbf6d5e052b949c8637999e71c
      EXPECTED_PARENT_SHA: 9702004a6230d6a84cc322edb48b55c14e90fe15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5
      - name: Verify exact stacked lineage
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          echo "UCI5_CI_CONTRACT_RED_EXACT_LINEAGE=PASS"
      - name: Prove runtime baseline remains green
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py -q | tee "$RUNNER_TEMP/uci5-runtime.log"
          grep -Eq '20 passed' "$RUNNER_TEMP/uci5-runtime.log"
          echo "UCI5_RUNTIME_BASELINE_20=PASS"
      - name: Prove intended CI-contract RED
        working-directory: aegis
        shell: bash
        run: |
          set +e
          python -m pytest sovereign-omega-v2/python/tests/test_uci5_ci_contract.py -q > "$RUNNER_TEMP/uci5-ci-contract-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/uci5-ci-contract-red.log"
          test "$rc" -ne 0
          grep -q "test_uci5_ci_binds_literal_frozen_parent_and_pr_base" "$RUNNER_TEMP/uci5-ci-contract-red.log"
          grep -q "test_uci5_ci_locks_expected_proofline_cardinality" "$RUNNER_TEMP/uci5-ci-contract-red.log"
          grep -Eq '2 failed' "$RUNNER_TEMP/uci5-ci-contract-red.log"
          echo "UCI5_CI_CONTRACT_RED_REPRODUCED=PASS"
