name: AEGIS UCI-5 GREEN Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'AEGIS_UCI5_GREEN.md'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: Aegis-Omega/AEGIS-OMEGA
      CANDIDATE_SHA: 66e45236ce4f50d247410e72301d2e419238348f
      EXPECTED_PARENT_SHA: 9702004a6230d6a84cc322edb48b55c14e90fe15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5
      - name: Verify exact stacked lineage
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          echo "UCI5_GREEN_EXACT_LINEAGE=PASS"
      - name: Run focused UCI-5 falsifiers
        working-directory: aegis
        run: python -m pytest sovereign-omega-v2/python/tests/test_uci5_atomic_admission.py -q
