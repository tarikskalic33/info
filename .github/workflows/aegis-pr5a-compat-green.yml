name: AEGIS PR5A Compatibility GREEN

on:
  pull_request:
    branches: [main]
    paths:
      - 'PR5A_WITNESS_TRIGGER_10.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Aegis-Omega/AEGIS-OMEGA
  CANDIDATE_SHA: 319c2262fbfbd15af5752e6bdbf4b1d464593443
  PROVIDER_PARENT_SHA: 31aec51c32caa2431cb94ee742c912059802568b
  VERIFICATION_PARENT_SHA: 6407db1b0c4176f67a1d7ecbb16eca77d131d87e

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove ancestry
        run: |
          set -euo pipefail
          test "$(git -C aegis merge-base "$PROVIDER_PARENT_SHA" "$CANDIDATE_SHA")" = "$PROVIDER_PARENT_SHA"
          test "$(git -C aegis merge-base "$VERIFICATION_PARENT_SHA" "$CANDIDATE_SHA")" = "$VERIFICATION_PARENT_SHA"
          echo PR5A_ANCESTRY_AFTER_COMPAT_FIX=PASS
      - name: Install dependencies
        working-directory: aegis
        run: python -m pip install --disable-pip-version-check -r harness/requirements-automaton3.txt
      - name: Run reconciled PR1 and PR2 suites
        working-directory: aegis
        run: |
          set -euo pipefail
          python sovereign-omega-v2/python/tests/test_transition_receipts_pr1.py -v
          python sovereign-omega-v2/python/tests/test_transition_receipts_cli_pr1.py -v
          python sovereign-omega-v2/python/tests/test_effect_adapters_pr2.py -v
      - name: Run full integrated Automaton3 matrix
        working-directory: aegis
        run: |
          set -euo pipefail
          python scripts/run-automaton3-tests.py --output "$RUNNER_TEMP/summary.json" --log "$RUNNER_TEMP/automaton3.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'summary.json').read_text())
          assert s['return_code']==0,s
          assert s['observed_test_count']==115,s
          assert s['test_count_matches_expected'] is True,s
          print('PR5A_INTEGRATED_AUTOMATON3_115_OF_115=PASS')
          PY
