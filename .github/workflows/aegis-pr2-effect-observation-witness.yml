name: AEGIS PR-2 Effect Observation Witness

on:
  pull_request:
    branches: [main]
    paths:
      - 'AEGIS_PR2_EFFECT_OBSERVATION_WITNESS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: Aegis-Omega/AEGIS-OMEGA
      CANDIDATE_SHA: 038a497e12c8f27de68091f551a85aff49f69740
      EXPECTED_PARENT_SHA: 6bf071d9c757d0f3514904f1efad3e3b14a60a09
    steps:
      - name: Checkout witness repository
        uses: actions/checkout@v4

      - name: Checkout exact AEGIS PR-2 candidate
        uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          path: aegis

      - name: Verify exact stacked lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C aegis rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C aegis merge-base "$EXPECTED_PARENT_SHA" "$CANDIDATE_SHA")" = "$EXPECTED_PARENT_SHA"
          echo "PR2_SOURCE_SHA=$CANDIDATE_SHA"
          echo "PR2_STACKED_PARENT=$EXPECTED_PARENT_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        working-directory: aegis
        run: python -m pip install jsonschema==4.23.0

      - name: Validate EffectWitness schema
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          path = Path('schemas/effect-witness.v1.schema.json')
          schema = json.loads(path.read_text(encoding='utf-8'))
          validator_for(schema).check_schema(schema)
          assert schema['properties']['witness_kind']['const'] == 'EFFECT_WITNESS_V1'
          print('EFFECT_WITNESS_SCHEMA=PASS')
          PY

      - name: Run PR-2 falsification suite
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python sovereign-omega-v2/python/tests/test_effect_adapters_pr2.py 2>&1 | tee "$RUNNER_TEMP/PR2_EFFECT_TEST.log"
          grep -F 'Ran 17 tests' "$RUNNER_TEMP/PR2_EFFECT_TEST.log"
          grep -F 'OK' "$RUNNER_TEMP/PR2_EFFECT_TEST.log"
          echo 'PR2_EFFECT_OBSERVATION_17_TESTS=PASS'

      - name: Re-run frozen PR-1 58-test suite unchanged
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run-automaton3-tests.py \
            --output "$RUNNER_TEMP/PR1_REGRESSION_SUMMARY.json" \
            --log "$RUNNER_TEMP/PR1_REGRESSION.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'PR1_REGRESSION_SUMMARY.json'
          s = json.loads(p.read_text(encoding='utf-8'))
          assert s['return_code'] == 0, s
          assert s['actual_test_count'] == 58, s
          assert s['test_count_matches_expected'] is True, s
          assert s['pr1_safe_incompleteness_asserted'] is True, s
          print('PR1_58_TEST_REGRESSION=PASS')
          PY

      - name: Verify PR-2 epistemic non-claims statically
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          from harness.sdk.effect_adapters import FilesystemEffectAdapter
          from harness.sdk.transition_receipts import EffectReceipt, accept_effect_evidence

          sig = inspect.signature(FilesystemEffectAdapter.observe_effect)
          assert 'post_state_digest' not in sig.parameters
          assert 'post_state_commitment' not in sig.parameters
          assert EffectReceipt.__dataclass_params__.frozen is True
          assert accept_effect_evidence(None) is False
          print('CALLER_POST_STATE_AUTHORITY=FORBIDDEN')
          print('COMPLETE_V_EFFECT_ACCEPTANCE=UNAVAILABLE')
          PY

      - name: Emit witness bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aegis-pr2-effect-witness"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/PR2_EFFECT_TEST.log" "$out/"
          cp "$RUNNER_TEMP/PR1_REGRESSION_SUMMARY.json" "$out/"
          cp "$RUNNER_TEMP/PR1_REGRESSION.log" "$out/"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'aegis-pr2-effect-witness'
          witness = {
              'witness_kind': 'AEGIS_PR2_EXTERNAL_EFFECT_OBSERVATION_WITNESS_V1',
              'epistemic_scope': 'REFERENCE_EFFECT_OBSERVATION_NOT_COMPLETE_VERIFICATION_OR_ADMISSION',
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'expected_parent_sha': os.environ['EXPECTED_PARENT_SHA'],
              'pr2_effect_tests': 17,
              'pr1_regression_tests': 58,
              'effect_bound_admission': 'UNAVAILABLE',
              'complete_verification': 'NOT_IMPLEMENTED',
              'atomic_admission': 'NOT_IMPLEMENTED',
          }
          body = json.dumps(witness, sort_keys=True, separators=(',', ':')).encode()
          witness['witness_root'] = hashlib.sha256(body).hexdigest()
          (out / 'EXTERNAL_WITNESS.json').write_text(json.dumps(witness, indent=2, sort_keys=True) + '\n')
          PY
          (cd "$out" && sha256sum * | LC_ALL=C sort > SHA256SUMS)

      - name: Upload witness
        uses: actions/upload-artifact@v4
        with:
          name: aegis-pr2-effect-observation-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/aegis-pr2-effect-witness
          if-no-files-found: error
          retention-days: 90
