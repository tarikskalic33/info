name: AEGIS Sovereign npm Audit Repair

on:
  pull_request:
    paths:
      - '.github/workflows/aegis-sovereign-npm-audit-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_REPO: Aegis-Omega/AEGIS-OMEGA
  CANDIDATE_SHA: 2b649cd6560ad058ab552bfea72b7fb2d9184260
  EXPECTED_PARENT_SHA: 32b7eb6a37fb69d19dd80189390b6641c5004ef1

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout witness repo
        uses: actions/checkout@v4

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AEGIS_REPO }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0

      - name: Prove inherited dependency baseline
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_PARENT_SHA"
          git diff --quiet "$EXPECTED_PARENT_SHA" "$CANDIDATE_SHA" -- sovereign-omega-v2/package.json sovereign-omega-v2/package-lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aegis/sovereign-omega-v2/package-lock.json

      - name: Install baseline
        working-directory: aegis/sovereign-omega-v2
        run: npm ci

      - name: Generate minimal audit repair in lockfile only
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json.before"
          npm audit fix --package-lock-only --ignore-scripts
          cmp package.json "$RUNNER_TEMP/package.json.before"
          git diff --exit-code -- package.json
          test -n "$(git diff --name-only -- package-lock.json)"
          git diff -- package-lock.json | tee ../../resolved-lock.diff

      - name: Clean-install resolved lock
        working-directory: aegis/sovereign-omega-v2
        run: npm ci

      - name: Require zero high vulnerabilities
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high --json 2>&1 | tee ../../resolved-audit.json

      - name: UCI regression on resolved lock
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --run test/unit/collective/collective-work-contract.test.ts test/unit/collective/collective-work-schema.test.ts test/vectors/uci-1-collective-work-vectors.test.ts test/unit/collective/provider-claim-lease.test.ts test/unit/collective/provider-claim-lease-schema.test.ts test/vectors/uci-2-provider-claim-vectors.test.ts
          npm run typecheck
          npm run build

      - name: Hash repair evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum aegis/sovereign-omega-v2/package-lock.json resolved-lock.diff resolved-audit.json | tee resolved-lock.sha256

      - name: Upload resolved lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-sovereign-resolved-lock-${{ env.CANDIDATE_SHA }}
          path: |
            aegis/sovereign-omega-v2/package-lock.json
            resolved-lock.diff
            resolved-audit.json
            resolved-lock.sha256
          if-no-files-found: error
