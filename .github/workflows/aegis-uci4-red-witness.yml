name: AEGIS UCI-4 RED Witness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-uci4-red-witness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AEGIS_UCI4_RED.md'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REPOSITORY: Aegis-Omega/AEGIS-OMEGA
      CANDIDATE_SHA: 13a8ffbc907fc91751f84092b7befbbad47dd0f6
      EXPECTED_PARENT_SHA: ebec2f9c8fa00f54605d859df61512108ff3b71d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact test runtime
        run: python -m pip install pytest==8.3.5
      - name: Verify exact stacked lineage
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          echo "UCI4_RED_EXACT_LINEAGE=PASS"
      - name: Prove UCI-4 contract is RED for intended missing effect-chain module
        working-directory: aegis
        shell: bash
        run: |
          set +e
          python -m pytest sovereign-omega-v2/python/tests/test_uci4_effect_chain_integration.py -q > "$RUNNER_TEMP/uci4-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/uci4-red.log"
          test "$rc" -ne 0
          grep -q "No module named 'harness.sdk.transition_receipts'" "$RUNNER_TEMP/uci4-red.log"
          echo "UCI4_RED_INTENDED_MISSING_TRANSITION_RECEIPTS=PASS"
