name: AEGIS Provider Contribution Capability Validation

on:
  pull_request:
    branches: [main]
    paths: ['AEGIS_PR3_RED.md']

permissions:
  contents: read

jobs:
  validate:
    name: capability-validation-${{ matrix.validation }}
    strategy:
      fail-fast: false
      matrix:
        validation: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: cc9671326bee5c347cdc3070b75a3c0fe647541d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact candidate
        working-directory: aegis
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install canonical validators
        working-directory: aegis
        run: python -m pip install --requirement harness/requirements-automaton3.txt

      - name: Run provider contribution contracts
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            agents.tests.test_organism_loop \
            agents.tests.test_provider_contribution \
            agents.tests.test_provider_session \
            2>&1 | tee "$RUNNER_TEMP/python.log"
          grep -q "Ran 33 tests" "$RUNNER_TEMP/python.log"
          grep -q "OK" "$RUNNER_TEMP/python.log"

      - name: Build and run contribution integration
        working-directory: aegis/sovereign-omega-v2/mcp-server
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node test/organism-contribution.mjs | tee "$RUNNER_TEMP/mcp.log"
          grep -q 'MCP_ORGANISM_PROVIDER_CONTRIBUTION=PASS' "$RUNNER_TEMP/mcp.log"
          grep -q 'MCP_ORGANISM_CONTENT_ADDRESSED_TEXT=PASS' "$RUNNER_TEMP/mcp.log"
          grep -q 'MCP_ORGANISM_PRESTATE_FENCE=PASS' "$RUNNER_TEMP/mcp.log"

      - name: Emit deterministic capability validation record
        shell: bash
        env:
          VALIDATION_INDEX: ${{ matrix.validation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'capability-validation.json'
          body = {
              'validation_kind': 'AEGIS_CAPABILITY_VALIDATION_V1',
              'capability': 'mcp.organism.contribute',
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'runner_repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'validation_index': int(os.environ['VALIDATION_INDEX']),
              'python_contracts': {'passed': 33, 'failed': 0},
              'mcp_build': 'PASS',
              'content_addressed_contribution': 'PASS',
              'prestate_fence': 'PASS',
              'authority_claim': 'NONE',
          }
          payload = json.dumps(body, sort_keys=True, separators=(',', ':')).encode()
          body['record_sha256'] = hashlib.sha256(payload).hexdigest()
          out.write_text(json.dumps(body, sort_keys=True, indent=2) + '\n')
          print(out.read_text())
          PY
          sha256sum "$RUNNER_TEMP/capability-validation.json"

      - uses: actions/upload-artifact@v4
        with:
          name: provider-contribution-validation-${{ matrix.validation }}
          path: ${{ runner.temp }}/capability-validation.json
          if-no-files-found: error
          retention-days: 90
