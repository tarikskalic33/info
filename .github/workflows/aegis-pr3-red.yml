name: AEGIS Organism Loop GREEN

on:
  pull_request:
    branches: [main]
    paths: ['AEGIS_PR3_RED.md']

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: 8d6dc2fd1eb007239dff562706264ec83f54c70d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run organism contract
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v agents.tests.test_organism_loop 2>&1 | tee "$RUNNER_TEMP/organism-green.log"
          grep -q "Ran 11 tests" "$RUNNER_TEMP/organism-green.log"
          grep -q "OK" "$RUNNER_TEMP/organism-green.log"
          echo ORGANISM_LOOP_11_OF_11=PASS
      - name: Smoke CLI persistence and operator gate
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          export AEGIS_ORGANISM_STORE="$RUNNER_TEMP/organism.json"
          python -m agents.organism submit --id d3-1 --event deployment_event --payload '{"service":"prod"}' --consequence D3 > "$RUNNER_TEMP/submit.json"
          python -m agents.organism inbox > "$RUNNER_TEMP/inbox.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          submit=json.loads((p/'submit.json').read_text())
          inbox=json.loads((p/'inbox.json').read_text())
          assert submit['status']=='WAITING_OPERATOR', submit
          assert [x['work_id'] for x in inbox]==['d3-1'], inbox
          print('ORGANISM_D3_PERSISTENT_INBOX=PASS')
          PY
