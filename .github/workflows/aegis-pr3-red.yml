name: AEGIS Organism + MCP Contribution GREEN

on:
  pull_request:
    branches: [main]
    paths: ['AEGIS_PR3_RED.md']

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 74b3b01ea8f3dec393ce9bbfae4a328d306f872a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact candidate
        working-directory: aegis
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install canonical Automaton-3 validators
        working-directory: aegis
        run: python -m pip install --requirement harness/requirements-automaton3.txt

      - name: Run organism, contribution and provider-session contracts
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            agents.tests.test_organism_loop \
            agents.tests.test_provider_contribution \
            agents.tests.test_provider_session \
            2>&1 | tee "$RUNNER_TEMP/organism-green.log"
          grep -q "Ran 33 tests" "$RUNNER_TEMP/organism-green.log"
          grep -q "OK" "$RUNNER_TEMP/organism-green.log"
          echo ORGANISM_PROVIDER_SESSION_33_OF_33=PASS

      - name: Smoke persistent D3 operator inbox
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          export AEGIS_ORGANISM_STORE="$RUNNER_TEMP/organism-d3.json"
          python -m agents.organism submit --id d3-1 --event deployment_event --payload '{"service":"prod"}' --consequence D3 > "$RUNNER_TEMP/submit.json"
          python -m agents.organism inbox > "$RUNNER_TEMP/inbox.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          submit=json.loads((p/'submit.json').read_text())
          inbox=json.loads((p/'inbox.json').read_text())
          assert submit['status']=='WAITING_OPERATOR', submit
          assert [x['work_id'] for x in inbox]==['d3-1'], inbox
          print('ORGANISM_D3_PERSISTENT_INBOX=PASS')
          PY

      - name: Install and build existing AEGIS MCP server
        working-directory: aegis/sovereign-omega-v2/mcp-server
        run: |
          npm ci
          npm run build

      - name: Run existing MCP regression surface
        working-directory: aegis/sovereign-omega-v2/mcp-server
        run: |
          npm run test:resources
          npm run test:automaton3

      - name: Run MCP durable contribution integration
        working-directory: aegis/sovereign-omega-v2/mcp-server
        run: npm run test:organism

      - name: Emit witness summary
        run: |
          echo CANDIDATE_SHA=$CANDIDATE_SHA
          echo ORGANISM_LOOP=PASS
          echo PROVIDER_SESSION_BOOTSTRAP=PASS
          echo NEXT_WORK=PASS
          echo CONTENT_ADDRESSED_CONTRIBUTION=PASS
          echo CONTRIBUTION_PRESTATE_FENCE=PASS
          echo PROVIDER_CONTRIBUTION=NON_AUTHORITATIVE_EVIDENCE_ONLY
          echo MCP_COMMON_ORGAN=PASS
          echo D3_OPERATOR_APPROVAL=REQUIRED
          echo D4=DENIED
