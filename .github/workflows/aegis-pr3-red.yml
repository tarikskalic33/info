name: AEGIS Cross-Provider Organism Exact-Head Witness

on:
  pull_request:
    branches: [main]
    paths: ['AEGIS_PR3_RED.md']

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 9fe98c88fe67a6872e9d9ef6328a700778a872e6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact candidate
        working-directory: aegis
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install canonical Automaton-3 validators
        working-directory: aegis
        run: python -m pip install --requirement harness/requirements-automaton3.txt

      - name: Verify narrow capability promotion and committed evidence
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from harness.sdk.skill_authority import evaluate_registry
          from harness.sdk.sovereign_execution import load_capability_registry_from_commit

          root = Path('.').resolve()
          tree = json.loads(Path('harness/skill_tree.json').read_text())
          receipt = evaluate_registry(tree, repo_root=root)
          assert receipt.outcome == 'ADMITTED', receipt
          skill = next(s for s in tree['skills'] if s.get('skill_id') == 'organism_provider_contribution')
          assert skill['observation_state'] == 'OBSERVED'
          assert skill['validated_runs'] == 3
          assert skill['failure_rate_observed'] == 0.0
          assert len(skill['evidence_refs']) == 3
          assert next(s for s in tree['skills'] if s.get('skill_id') == 'orchestration_routing')['observation_state'] == 'UNOBSERVED'

          registry, _, _ = load_capability_registry_from_commit(
              repository_root=root,
              source_commit=os.environ['CANDIDATE_SHA'],
              skill_tree_path='harness/skill_tree.json',
              capability_map_path='harness/policies/capability-map.v1.json',
          )
          capability = registry['mcp.organism.contribute']
          assert capability.skill_id == 'organism_provider_contribution'
          assert capability.observation_state == 'OBSERVED'
          assert capability.validated_runs == 3
          assert capability.allowed_action_classes == ('D1',)
          assert set(capability.allowed_tools) == {'aegis_contribute', 'aegis_contribute_text'}
          print('NARROW_CAPABILITY_PROMOTION=PASS')
          print('BROADER_ORCHESTRATION_PROMOTION=ABSENT')
          PY

      - name: Run organism, contribution and provider-session contracts
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            agents.tests.test_organism_loop \
            agents.tests.test_provider_contribution \
            agents.tests.test_provider_session \
            2>&1 | tee "$RUNNER_TEMP/organism-green.log"
          grep -q "Ran 33 tests" "$RUNNER_TEMP/organism-green.log"
          grep -q "OK" "$RUNNER_TEMP/organism-green.log"
          echo ORGANISM_PROVIDER_SESSION_33_OF_33=PASS

      - name: Smoke persistent D3 operator inbox
        working-directory: aegis
        shell: bash
        run: |
          set -euo pipefail
          export AEGIS_ORGANISM_STORE="$RUNNER_TEMP/organism-d3.json"
          python -m agents.organism submit --id d3-1 --event deployment_event --payload '{"service":"prod"}' --consequence D3 > "$RUNNER_TEMP/submit.json"
          python -m agents.organism inbox > "$RUNNER_TEMP/inbox.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          submit=json.loads((p/'submit.json').read_text())
          inbox=json.loads((p/'inbox.json').read_text())
          assert submit['status']=='WAITING_OPERATOR', submit
          assert [x['work_id'] for x in inbox]==['d3-1'], inbox
          print('ORGANISM_D3_PERSISTENT_INBOX=PASS')
          PY

      - name: Install and build AEGIS MCP server
        working-directory: aegis/sovereign-omega-v2/mcp-server
        run: |
          npm ci
          npm run build

      - name: Run existing MCP regressions
        working-directory: aegis/sovereign-omega-v2/mcp-server
        run: |
          npm run test:resources
          npm run test:automaton3

      - name: Run real provider-session stdio MCP work cycle
        working-directory: aegis/sovereign-omega-v2/mcp-server
        run: npm run test:organism

      - name: Emit deterministic exact-head witness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          body = {
              'witness_kind': 'AEGIS_CROSS_PROVIDER_ORGANISM_EXACT_HEAD_V1',
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'runner_repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'python_contracts': {'passed': 33, 'failed': 0},
              'narrow_capability': 'mcp.organism.contribute',
              'narrow_capability_validated_runs': 3,
              'broader_orchestration_promotion': 'NONE',
              'provider_session_bootstrap': 'PASS',
              'mcp_provider_stdio_e2e': 'PASS',
              'next_work': 'PASS',
              'content_addressed_contribution': 'PASS',
              'contribution_prestate_fence': 'PASS',
              'provider_contribution_authority': 'NON_AUTHORITATIVE_EVIDENCE_ONLY',
              'd3_operator_approval': 'REQUIRED',
              'd4': 'DENIED',
          }
          canonical = json.dumps(body, sort_keys=True, separators=(',', ':')).encode()
          body['witness_sha256'] = hashlib.sha256(canonical).hexdigest()
          out = Path(os.environ['RUNNER_TEMP']) / 'cross-provider-organism-witness.json'
          out.write_text(json.dumps(body, sort_keys=True, indent=2) + '\n')
          print(out.read_text())
          PY
          sha256sum "$RUNNER_TEMP/cross-provider-organism-witness.json"

      - uses: actions/upload-artifact@v4
        with:
          name: cross-provider-organism-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/cross-provider-organism-witness.json
          if-no-files-found: error
          retention-days: 90
