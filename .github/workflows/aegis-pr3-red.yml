name: AEGIS Organism Loop RED

on:
  pull_request:
    branches: [main]
    paths: ['AEGIS_PR3_RED.md']

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: a8ecfa4a8857abdcff75aab1e7ce9c3d9485f45f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove organism contract is RED for intended missing module
        working-directory: aegis
        shell: bash
        run: |
          set +e
          python -m unittest agents.tests.test_organism_loop > "$RUNNER_TEMP/organism-red.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/organism-red.log"
          test "$rc" -ne 0
          grep -q "No module named 'agents.organism'" "$RUNNER_TEMP/organism-red.log"
          echo ORGANISM_RED_INTENDED_MISSING_MODULE=PASS
