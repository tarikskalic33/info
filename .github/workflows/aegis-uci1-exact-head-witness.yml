name: AEGIS UCI Exact-Head Witness

on:
  pull_request:
    paths:
      - '.github/workflows/aegis-uci1-exact-head-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_REPO: Aegis-Omega/AEGIS-OMEGA
  CANDIDATE_SHA: 2b649cd6560ad058ab552bfea72b7fb2d9184260
  EXPECTED_PARENT_SHA: 32b7eb6a37fb69d19dd80189390b6641c5004ef1

jobs:
  uci-witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout witness repo
        uses: actions/checkout@v4

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AEGIS_REPO }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0

      - name: Bind exact candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          cd aegis
          actual="$(git rev-parse HEAD)"
          base="$(git merge-base HEAD origin/main)"
          printf 'CANDIDATE_SHA=%s\nEXPECTED_PARENT_SHA=%s\nMERGE_BASE=%s\n' "$actual" "$EXPECTED_PARENT_SHA" "$base" | tee ../uci-lineage.txt
          test "$actual" = "$CANDIDATE_SHA"
          test "$base" = "$EXPECTED_PARENT_SHA"
          git diff --quiet "$EXPECTED_PARENT_SHA" "$CANDIDATE_SHA" -- sovereign-omega-v2/package.json sovereign-omega-v2/package-lock.json
          echo 'UCI_DEPENDENCY_DELTA=NONE' | tee -a ../uci-lineage.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aegis/sovereign-omega-v2/package-lock.json

      - name: Install exact dependencies
        working-directory: aegis/sovereign-omega-v2
        run: npm ci

      - name: Capture inherited npm audit baseline
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set +e
          npm audit --json 2>&1 | tee ../../uci-npm-audit.json
          echo "NPM_AUDIT_EXIT=${PIPESTATUS[0]}" | tee ../../uci-npm-audit-status.txt
          exit 0

      - name: UCI-1 regression
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --run test/unit/collective/collective-work-contract.test.ts test/unit/collective/collective-work-schema.test.ts test/vectors/uci-1-collective-work-vectors.test.ts 2>&1 | tee ../../uci1-regression.txt

      - name: UCI-2 durable claim lease
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --run test/unit/collective/provider-claim-lease.test.ts test/unit/collective/provider-claim-lease-schema.test.ts test/vectors/uci-2-provider-claim-vectors.test.ts 2>&1 | tee ../../uci2-tests.txt

      - name: Typecheck
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee ../../uci-typecheck.txt

      - name: Build
        working-directory: aegis/sovereign-omega-v2
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../../uci-build.txt

      - name: Produce SHA-bound witness summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "AEGIS_UCI_EXTERNAL_EXACT_HEAD_WITNESS=PASS"
            cat uci-lineage.txt
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
            cat uci-npm-audit-status.txt
            sha256sum uci1-regression.txt uci2-tests.txt uci-typecheck.txt uci-build.txt uci-npm-audit.json
            echo "PRODUCTION_ADMISSION=NOT_ESTABLISHED"
            echo "AGI=NOT_ESTABLISHED"
          } | tee uci-witness-summary.txt
          sha256sum uci-witness-summary.txt | tee uci-witness-summary.sha256

      - name: Upload witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-uci-exact-head-witness-${{ env.CANDIDATE_SHA }}
          path: |
            uci-lineage.txt
            uci1-regression.txt
            uci2-tests.txt
            uci-typecheck.txt
            uci-build.txt
            uci-npm-audit.json
            uci-npm-audit-status.txt
            uci-witness-summary.txt
            uci-witness-summary.sha256
          if-no-files-found: error
