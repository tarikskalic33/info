name: AEGIS UCI Exact-Head Witness

on:
  pull_request:
    paths:
      - '.github/workflows/aegis-uci1-exact-head-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_REPO: Aegis-Omega/AEGIS-OMEGA
  CANDIDATE_SHA: 2c09eefe8e8192514e0ea9336d1a43628c9884b1
  EXPECTED_PARENT_SHA: 32b7eb6a37fb69d19dd80189390b6641c5004ef1

jobs:
  uci-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AEGIS_REPO }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0
      - name: Bind exact candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          cd aegis
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_PARENT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aegis/sovereign-omega-v2/package-lock.json
      - name: Install
        working-directory: aegis/sovereign-omega-v2
        run: npm ci
      - name: UCI-1 + UCI-2 regression
        working-directory: aegis/sovereign-omega-v2
        run: npm test -- --run test/unit/collective/collective-work-contract.test.ts test/unit/collective/collective-work-schema.test.ts test/vectors/uci-1-collective-work-vectors.test.ts test/unit/collective/provider-claim-lease.test.ts test/unit/collective/provider-claim-lease-transaction.test.ts test/unit/collective/provider-claim-lease-schema.test.ts test/vectors/uci-2-provider-claim-vectors.test.ts
      - name: UCI-3 runtime
        working-directory: aegis/sovereign-omega-v2
        run: npm test -- --run test/unit/collective/provider-contribution.test.ts test/unit/collective/provider-contribution-store.test.ts
      - name: UCI-3 schemas and vectors
        working-directory: aegis/sovereign-omega-v2
        run: npm test -- --run test/unit/collective/provider-contribution-schema.test.ts test/vectors/uci-3-provider-contribution-vectors.test.ts
      - name: Typecheck
        working-directory: aegis/sovereign-omega-v2
        run: npm run typecheck
      - name: Build
        working-directory: aegis/sovereign-omega-v2
        run: npm run build
