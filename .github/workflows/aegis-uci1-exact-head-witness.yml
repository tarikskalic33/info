name: AEGIS UCI-1 Exact-Head Witness

on:
  pull_request:
    paths:
      - '.github/workflows/aegis-uci1-exact-head-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_REPO: Aegis-Omega/AEGIS-OMEGA
  CANDIDATE_SHA: 939988de44273a712ea4bc89ce8f4e97b591bfa3
  EXPECTED_PARENT_SHA: 32b7eb6a37fb69d19dd80189390b6641c5004ef1

jobs:
  uci1-witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout witness repo
        uses: actions/checkout@v4
      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AEGIS_REPO }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0
      - name: Bind exact candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          cd aegis
          actual="$(git rev-parse HEAD)"
          base="$(git merge-base HEAD origin/main)"
          echo "CANDIDATE_SHA=$actual"
          echo "EXPECTED_PARENT_SHA=${EXPECTED_PARENT_SHA}"
          echo "MERGE_BASE=$base"
          test "$actual" = "$CANDIDATE_SHA"
          test "$base" = "$EXPECTED_PARENT_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aegis/sovereign-omega-v2/package-lock.json
      - name: Install exact dependencies
        working-directory: aegis/sovereign-omega-v2
        run: npm ci
      - name: UCI-1 focused tests
        working-directory: aegis/sovereign-omega-v2
        run: npm test -- --run test/unit/collective/collective-work-contract.test.ts test/unit/collective/collective-work-schema.test.ts test/vectors/uci-1-collective-work-vectors.test.ts
