name: AEGIS UCI Reflexive Exact-Head Witness

on:
  push:
    paths:
      - '.github/workflows/aegis-uci1-exact-head-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_REPO: Aegis-Omega/AEGIS-OMEGA
  CANDIDATE_SHA: 600a9e37257b8fd2245b999687b8bbfd46123c6d
  EXPECTED_PARENT_SHA: 32b7eb6a37fb69d19dd80189390b6641c5004ef1

jobs:
  uci-reflexive-witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout witness repo
        uses: actions/checkout@v4

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AEGIS_REPO }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: aegis
          fetch-depth: 0

      - name: Bind exact candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          cd aegis
          actual="$(git rev-parse HEAD)"
          base="$(git merge-base HEAD origin/main)"
          echo "CANDIDATE_SHA=$actual"
          echo "EXPECTED_PARENT_SHA=${EXPECTED_PARENT_SHA}"
          test "$actual" = "$CANDIDATE_SHA"
          test "$base" = "$EXPECTED_PARENT_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aegis/sovereign-omega-v2/package-lock.json

      - name: Install exact dependencies
        working-directory: aegis/sovereign-omega-v2
        run: npm ci

      - name: Prior UCI regression
        working-directory: aegis/sovereign-omega-v2
        run: npx vitest run test/unit/collective/*.test.ts test/vectors/uci-*.test.ts

      - name: Math verification regression
        working-directory: aegis/sovereign-omega-v2
        run: npx vitest run test/unit/math-verification/*.test.ts test/vectors/math-disproval-gate-vectors.test.ts

      - name: Reflexive exact-head pass 1
        working-directory: aegis/sovereign-omega-v2
        run: npx vitest run test/unit/reflexive-self-model/*.test.ts test/vectors/reflexive-self-model-vectors.test.ts

      - name: Reflexive exact-head pass 2
        working-directory: aegis/sovereign-omega-v2
        run: npx vitest run test/unit/reflexive-self-model/*.test.ts test/vectors/reflexive-self-model-vectors.test.ts

      - name: Legacy self-calibration regression
        working-directory: aegis/sovereign-omega-v2
        run: npx vitest run test/unit/self-calibration*.test.ts

      - name: Strict typecheck
        working-directory: aegis/sovereign-omega-v2
        run: npm run typecheck

      - name: Production build
        working-directory: aegis/sovereign-omega-v2
        run: npm run build

      - name: Create content-addressed witness receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p witness-artifact
          candidate="$(cd aegis && git rev-parse HEAD)"
          base="$(cd aegis && git merge-base HEAD origin/main)"
          corpus_sha="$(sha256sum aegis/test-vectors/reflexive-self-model/reflexive-self-model-v1.json | awk '{print $1}')"
          workflow_sha="$(sha256sum .github/workflows/aegis-uci1-exact-head-witness.yml | awk '{print $1}')"
          cat > witness-artifact/reflexive-exact-head-witness-v1.json <<EOF
          {
            "receipt_kind": "AEGIS_REFLEXIVE_EXACT_HEAD_WITNESS_V1",
            "candidate_sha": "${candidate}",
            "canonical_merge_base_sha": "${base}",
            "reflexive_corpus_sha256": "${corpus_sha}",
            "witness_workflow_sha256": "${workflow_sha}",
            "prior_uci_regression": "PASS",
            "math_verification_regression": "PASS",
            "reflexive_pass_1": "PASS",
            "reflexive_pass_2": "PASS",
            "self_calibration_regression": "PASS",
            "typecheck": "PASS",
            "production_build": "PASS",
            "authority": "EVIDENCE_ONLY"
          }
          EOF
          sha256sum witness-artifact/reflexive-exact-head-witness-v1.json \
            > witness-artifact/reflexive-exact-head-witness-v1.sha256
          cat witness-artifact/reflexive-exact-head-witness-v1.sha256

      - name: Upload witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-reflexive-exact-head-${{ env.CANDIDATE_SHA }}
          path: witness-artifact/
          if-no-files-found: error
          retention-days: 30
